tasks:
  - name: stations_query
    reference_sql: "SELECT station_id, name FROM buoys.main.stations() ORDER BY station_id LIMIT 5"
  - name: latest_observations_query
    reference_sql: "SELECT station_id, wind_speed_mps FROM buoys.main.latest_observations() WHERE wind_speed_mps IS NOT NULL ORDER BY wind_speed_mps DESC, station_id LIMIT 5"
  - name: observations_query
    reference_sql: "SELECT time, wave_height_m FROM buoys.main.observations('44013') WHERE wave_height_m IS NOT NULL ORDER BY time DESC LIMIT 5"
  - name: reference_units
    reference_sql: "SELECT column_name, source_unit, output_unit, scale FROM buoys.main.measurements WHERE column_name = 'visibility_m'"
