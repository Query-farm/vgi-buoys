[project]
name = "vgi-buoys-notebooks"
version = "0.1.0"
description = "Released NOAA Buoys SQL examples"
requires-python = ">=3.12,<3.15"
dependencies = ["vgi-example-notebooks[runner]"]
[tool.uv.sources]
vgi-example-notebooks = { git = "https://github.com/Query-farm/vgi-example-notebooks", tag = "v0.3.34" }
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["F821"]
[tool.ruff.lint.isort]
known-first-party = ["recorded_api"]
